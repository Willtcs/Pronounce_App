<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>多語發音練習與對比 App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', 'Noto Sans TC', 'Noto Sans SC', 'Noto Sans JP', sans-serif;
      background-color: #070b14;
      color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
    }

    /* 手機外框與響應式設計 */
    .app-container {
      max-width: 440px;
      min-height: 100dvh;
      margin: 0 auto;
      background: linear-gradient(180deg, #0f172a 0%, #090e1a 100%);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    @media (min-width: 640px) {
      body {
        padding: 1.5rem 0;
        background: radial-gradient(circle at top, #1e293b 0%, #020617 100%);
      }
      .app-container {
        min-height: calc(100dvh - 3rem);
        border-radius: 2.25rem;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
    }

    /* 錄音脈動光圈 */
    @keyframes pulseRing {
      0% {
        transform: scale(0.96);
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.65);
      }
      70% {
        transform: scale(1);
        box-shadow: 0 0 0 16px rgba(239, 68, 68, 0);
      }
      100% {
        transform: scale(0.96);
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
      }
    }

    .mic-recording {
      animation: pulseRing 1.5s infinite cubic-bezier(0.4, 0, 0.6, 1);
    }

    /* 音波跳動動畫 */
    @keyframes soundWave {
      0%, 100% { height: 5px; }
      50% { height: 20px; }
    }
    .wave-bar {
      animation: soundWave 0.85s ease-in-out infinite;
    }
    .wave-bar:nth-child(2) { animation-delay: 0.15s; }
    .wave-bar:nth-child(3) { animation-delay: 0.3s; }
    .wave-bar:nth-child(4) { animation-delay: 0.45s; }
    .wave-bar:nth-child(5) { animation-delay: 0.2s; }

    /* 100% 全黃色發光特效 */
    .perfect-yellow-glow {
      color: #FACC15 !important;
      text-shadow: 0 0 18px rgba(250, 204, 21, 0.5);
    }

    .perfect-card-border {
      border-color: rgba(250, 204, 21, 0.7) !important;
      background: linear-gradient(180deg, rgba(250, 204, 21, 0.1) 0%, rgba(15, 23, 42, 0.96) 100%) !important;
      box-shadow: 0 0 32px rgba(234, 179, 8, 0.22);
    }

    /* 水平語言選單隱藏捲軸 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.25);
      border-radius: 9999px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 頂部導覽與 7 語系切換列 -->
    <header class="px-4 pt-5 pb-3 border-b border-slate-800/90 bg-slate-900/80 backdrop-blur-md sticky top-0 z-20">
      <div class="flex items-center justify-between mb-3 px-1">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-400 to-teal-600 flex items-center justify-center shadow-lg shadow-emerald-500/20">
            <svg class="w-5 h-5 text-slate-950" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 01-3-3V4.5a3 3 0 116 0v8.25a3 3 0 01-3 3z" />
            </svg>
          </div>
          <div>
            <h1 class="text-base font-extrabold tracking-tight text-white">多語發音教練 Pro</h1>
            <p class="text-[11px] text-slate-400">7 國語言口音 · 拼音音標即時糾錯</p>
          </div>
        </div>

        <!-- 練習次數徽章 -->
        <div id="attemptBadge" class="hidden px-2.5 py-1 rounded-full bg-slate-800 border border-slate-700 text-xs font-semibold text-slate-300">
          第 <span id="attemptCount" class="text-emerald-400 font-bold">1</span> 次
        </div>
      </div>

      <!-- 7 種語言/口音橫向滑動選擇器 -->
      <div id="languageBar" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1">
        <!-- 由 JS 動態生成 7 個語言膠囊按鈕 -->
      </div>
    </header>

    <!-- 主內容捲動區 -->
    <main class="flex-1 px-4 py-4 space-y-4 overflow-y-auto">

      <!-- 狀態提示條 (取代 alert) -->
      <div id="toastBanner" class="hidden px-3.5 py-2.5 rounded-xl bg-amber-500/15 border border-amber-500/40 text-amber-300 text-xs font-medium flex items-center justify-between gap-2">
        <span id="toastText">提示訊息</span>
        <button type="button" onclick="hideToast()" class="text-amber-400 hover:text-white font-bold px-1">✕</button>
      </div>

      <!-- 步驟 1：文字輸入框 + 清除/確認按鈕 -->
      <section class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 shadow-sm">
        <div class="flex items-center justify-between mb-2">
          <label for="targetInput" class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-sky-400"></span>
            步驟 1：輸入練習文字
          </label>
          <span id="activeLangTag" class="text-[11px] font-bold px-2 py-0.5 rounded-md bg-slate-800 text-emerald-400 border border-slate-700">
            普通話 (zh-CN)
          </span>
        </div>

        <!-- 快速測試範例膠囊 -->
        <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar mb-2.5" id="sampleChips">
          <!-- 由 JS 動態填入對應語言的 3 個精選範例 -->
        </div>

        <textarea id="targetInput" rows="2"
          placeholder="請輸入想要練習發音的句子或單字..."
          class="w-full bg-slate-950/95 border border-slate-700/80 focus:border-emerald-400 focus:ring-2 focus:ring-emerald-400/20 rounded-xl p-3 text-base text-white placeholder-slate-500 resize-none outline-none transition-all"></textarea>

        <!-- 左邊：清除 / 右邊：確認 -->
        <div class="grid grid-cols-2 gap-3 mt-3">
          <button type="button" id="clearBtn" onclick="handleClear()"
            class="py-3 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-[0.98] text-slate-200 font-bold text-sm border border-slate-700 transition-all flex items-center justify-center gap-1.5">
            <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
            清除
          </button>

          <button type="button" id="confirmBtn" onclick="handleConfirm()"
            class="py-3 px-4 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 active:scale-[0.98] text-slate-950 font-extrabold text-sm shadow-lg shadow-emerald-500/20 transition-all flex items-center justify-center gap-1.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
            確認
          </button>
        </div>
      </section>

      <!-- 步驟 2：目標文字欄、即時綠色語音輸入、紅字拼音對比、100%黃色完成 -->
      <section id="practiceSection" class="hidden space-y-4">

        <!-- 目標練習文字卡片 -->
        <div id="targetCard" class="bg-slate-900 border border-slate-700/80 rounded-2xl p-4 transition-all duration-500 relative">
          <div class="flex items-center justify-between mb-2.5">
            <span class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
              目標練習文字欄
            </span>

            <!-- 標準發音示範按鈕 (TTS) -->
            <button type="button" onclick="speakTargetText()"
              class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 active:scale-95 text-sky-400 text-xs font-semibold border border-slate-700 flex items-center gap-1 transition-all">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
              </svg>
              聽標準發音
            </button>
          </div>

          <!-- 100% 發音完全正確慶祝橫幅 -->
          <div id="perfectBanner" class="hidden mb-3 px-3 py-2 rounded-xl bg-yellow-400/15 border border-yellow-400/50 text-yellow-300 text-xs font-extrabold flex items-center justify-center gap-1.5">
            <span>🎉 太棒了！100% 發音完全正確！</span>
          </div>

          <!-- 動態渲染目標文字（正常白色 / 錯誤紅色拼音音標 / 100%全黃色） -->
          <div id="targetDisplayContainer" class="min-h-[82px] flex flex-wrap items-end gap-x-2.5 gap-y-3 py-2 px-1 leading-relaxed">
          </div>

          <!-- 準確率進度條與統計列 -->
          <div id="resultSummaryBar" class="hidden mt-3 pt-3 border-t border-slate-800 space-y-2">
            <div class="flex items-center justify-between text-xs">
              <div class="flex items-center gap-2">
                <span class="text-slate-400">發音準確率：</span>
                <span id="accuracyScore" class="font-extrabold text-base text-white">0%</span>
              </div>
              <div id="errorCountText" class="font-bold text-red-400">
                有 0 處發音需修正
              </div>
            </div>
            <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
              <div id="accuracyBarFill" class="h-full bg-emerald-400 transition-all duration-500" style="width: 0%"></div>
            </div>
          </div>
        </div>

        <!-- 即時語音辨識結果框 (以綠色顯示語音輸入中的文字) -->
        <div class="bg-slate-950/95 border border-slate-800 rounded-2xl p-4">
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs font-bold text-slate-400 flex items-center gap-1.5">
              <span id="liveDot" class="w-2 h-2 rounded-full bg-slate-600"></span>
              即時語音輸入顯示
            </span>
            <div id="soundWaveBars" class="hidden flex items-center gap-1 h-5">
              <span class="wave-bar w-1 bg-[#22C55E] rounded-full"></span>
              <span class="wave-bar w-1 bg-[#22C55E] rounded-full"></span>
              <span class="wave-bar w-1 bg-[#22C55E] rounded-full"></span>
              <span class="wave-bar w-1 bg-[#22C55E] rounded-full"></span>
              <span class="wave-bar w-1 bg-[#22C55E] rounded-full"></span>
            </div>
          </div>

          <!-- 綠色文字顯示區 (#22C55E) -->
          <div id="liveTranscriptText" class="min-h-[54px] text-lg font-bold tracking-wide text-[#22C55E] break-words leading-snug">
            <span class="text-slate-600 text-sm font-normal">點擊下方「開始錄音」並大聲朗讀上方文字...</span>
          </div>
        </div>

        <!-- 控制按鈕區 (開始錄音 / 停止並對比 / 再錄音 / 100%完成) -->
        <div class="pt-0.5 space-y-2.5">
          <!-- 開始錄音 -->
          <button type="button" id="startRecordBtn" onclick="startRecording()"
            class="w-full py-4 px-5 rounded-2xl bg-gradient-to-r from-emerald-500 to-green-500 hover:from-emerald-400 hover:to-green-400 active:scale-[0.98] text-slate-950 font-black text-base shadow-lg shadow-emerald-500/25 transition-all flex items-center justify-center gap-2.5">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 01-3-3V4.5a3 3 0 116 0v8.25a3 3 0 01-3 3z" />
            </svg>
            開始錄音
          </button>

          <!-- 停止錄音並對比發音 -->
          <button type="button" id="stopRecordBtn" onclick="stopRecordingAndCompare()"
            class="hidden mic-recording w-full py-4 px-5 rounded-2xl bg-gradient-to-r from-rose-500 to-red-500 hover:from-rose-400 hover:to-red-400 active:scale-[0.98] text-white font-black text-base shadow-lg shadow-rose-500/30 transition-all flex items-center justify-center gap-2.5">
            <span class="w-3.5 h-3.5 rounded-sm bg-white animate-pulse"></span>
            停止錄音並對比發音
          </button>

          <!-- 再錄音 (循環練習) -->
          <button type="button" id="reRecordBtn" onclick="handleReRecord()"
            class="hidden w-full py-4 px-5 rounded-2xl bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 active:scale-[0.98] text-slate-950 font-black text-base shadow-lg shadow-amber-500/25 transition-all flex items-center justify-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
            </svg>
            再錄音（修正紅色發音）
          </button>

          <!-- 100% 完成後的操作 -->
          <div id="perfectActions" class="hidden grid grid-cols-2 gap-3">
            <button type="button" onclick="handleReRecord()"
              class="py-3.5 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-yellow-300 font-bold text-sm border border-yellow-500/30 transition-all">
              再挑戰一次
            </button>
            <button type="button" onclick="handleNextSentence()"
              class="py-3.5 px-4 rounded-xl bg-yellow-400 hover:bg-yellow-300 text-slate-950 font-extrabold text-sm shadow-lg shadow-yellow-400/20 transition-all">
              下一句練習 ➔
            </button>
          </div>
        </div>

        <!-- 無麥克風 / 模擬測試面板 -->
        <div class="pt-2 border-t border-slate-800/80">
          <details class="group" open>
            <summary class="text-xs text-slate-400 hover:text-white cursor-pointer select-none flex items-center justify-between py-1 font-semibold">
              <span>🛠️ 無麥克風模擬測試（快速驗證 7 國語言）</span>
              <span class="group-open:rotate-180 transition-transform text-[10px]">▼</span>
            </summary>
            <div class="mt-2 p-3 rounded-xl bg-slate-900/95 border border-slate-800 space-y-2.5">
              <p class="text-[11px] text-slate-400 leading-relaxed">
                若目前環境無法使用麥克風，可直接模擬目前所選語言的語音辨識結果，測試紅色拼音/音標標示與 100% 黃色通關效果：
              </p>
              <div class="grid grid-cols-2 gap-2">
                <button type="button" onclick="simulateSpeech(false)"
                  class="py-2.5 px-2.5 rounded-lg bg-red-500/15 hover:bg-red-500/25 border border-red-500/40 text-red-300 text-xs font-bold transition-all">
                  模擬「部分發音錯誤」
                </button>
                <button type="button" onclick="simulateSpeech(true)"
                  class="py-2.5 px-2.5 rounded-lg bg-yellow-400/15 hover:bg-yellow-400/25 border border-yellow-400/40 text-yellow-300 text-xs font-bold transition-all">
                  模擬「100% 發音正確」
                </button>
              </div>
            </div>
          </details>
        </div>

      </section>
    </main>
  </div>

  <script>
    // =========================================================================
    // 1. 7 種語言與口音設定檔 (普通話、國語、美式英文、英式英文、日文、法文、德文)
    // =========================================================================
    const LANGUAGES = [
      {
        id: 'zh-CN',
        flag: '🇨🇳',
        name: '普通話',
        subLabel: 'zh-CN',
        type: 'cjk-zh',
        samples: [
          { label: '日常問候', text: '你好，我正在练习普通话发音' },
          { label: '繞口挑戰', text: '四是四，十是十，十四是十四' },
          { label: '生活對話', text: '今天天气真不错，我们一起去喝咖啡吧' }
        ]
      },
      {
        id: 'zh-TW',
        flag: '🇹🇼',
        name: '國語',
        subLabel: 'zh-TW',
        type: 'cjk-zh',
        samples: [
          { label: '台灣日常', text: '你好，我正在練習台灣國語發音' },
          { label: '聲調辨析', text: '知識就是力量，請保持熱情與自信' },
          { label: '點餐常用', text: '老闆，我要一杯珍珠奶茶微糖去冰' }
        ]
      },
      {
        id: 'en-US',
        flag: '🇺🇸',
        name: '美式英文',
        subLabel: 'en-US',
        type: 'latin',
        samples: [
          { label: '經典名言', text: 'Practice makes perfect every single day' },
          { label: '美式捲舌', text: 'Can I get a bottle of water on my schedule' },
          { label: '商務對話', text: 'We need better data to solve this problem' }
        ]
      },
      {
        id: 'en-GB',
        flag: '🇬🇧',
        name: '英式英文',
        subLabel: 'en-GB',
        type: 'latin',
        samples: [
          { label: '英式腔調', text: 'Would you fancy a cup of tea and biscuits' },
          { label: '英美差異', text: 'Please check your schedule and pass the water' },
          { label: '倫敦日常', text: 'What a brilliant day to walk around London' }
        ]
      },
      {
        id: 'ja-JP',
        flag: '🇯🇵',
        name: '日文',
        subLabel: 'ja-JP',
        type: 'cjk-ja',
        samples: [
          { label: '禮貌問候', text: 'こんにちは、発音の練習をしています' },
          { label: '感謝常用', text: 'いつもありがとうございます' },
          { label: '旅遊點餐', text: 'すみません、お水とメニューをお願いします' }
        ]
      },
      {
        id: 'fr-FR',
        flag: '🇫🇷',
        name: '法文',
        subLabel: 'fr-FR',
        type: 'latin',
        samples: [
          { label: '法式問候', text: 'Bonjour, comment allez-vous aujourd’hui' },
          { label: '咖啡廳', text: 'Je voudrais un croissant et un café merci' },
          { label: '浪漫表達', text: 'La vie est belle quand on parle français' }
        ]
      },
      {
        id: 'de-DE',
        flag: '🇩🇪',
        name: '德文',
        subLabel: 'de-DE',
        type: 'latin',
        samples: [
          { label: '德語問候', text: 'Guten Morgen, wie geht es Ihnen heute' },
          { label: '變音練習', text: 'Entschuldigung, ich möchte gern bezahlen' },
          { label: '日常道別', text: 'Vielen Dank für Ihre Hilfe und tschüss' }
        ]
      }
    ];

    // =========================================================================
    // 2. 多語系拼音 / 注音 / 假名羅馬音 / 美英IPA / 法德音標字典
    // =========================================================================

    // 中文常用字 -> [普通話拼音, 台灣國語拼音+注音]
    const ZH_PHONETIC_DICT = {

    // =========================================================================

    function renderLanguageBar() {

    function selectLanguage(langId) {
      if (isRecording) {
        stopSpeechEngine();
      }
      const found = LANGUAGES.find(l => l.id === langId);
      if (!found) return;
      currentLangObj = found;

      // 更新按鈕高亮狀態
      LANGUAGES.forEach(lang => {
        const btn = document.getElementById(`lang-btn-${lang.id}`);
        if (!btn) return;
        if (lang.id === langId) {
          btn.className = 'shrink-0 px-3 py-1.5 rounded-xl text-xs font-extrabold border transition-all flex items-center gap-1.5 bg-emerald-500 text-slate-950 border-emerald-400 shadow-md shadow-emerald-500/20';
          btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        } else {
          btn.className = 'shrink-0 px-3 py-1.5 rounded-xl text-xs font-semibold border transition-all flex items-center gap-1.5 bg-slate-950 text-slate-400 border-slate-800 hover:text-white';
        }
      });

      activeLangTag.textContent = `${currentLangObj.flag} ${currentLangObj.name} (${currentLangObj.subLabel})`;
      renderSampleChips();

      // 自動填入該語言的第一個範例方便直接測試
      if (currentLangObj.samples.length > 0) {
        targetInput.value = currentLangObj.samples[0].text;

      if (recognition) {
        recognition.lang = currentLangObj.id;
      }
      hideToast();
    }

      targetInput.value = '';

      practiceSection.classList.add('hidden');
      attemptBadge.classList.add('hidden');

    function handleConfirm() {
      const raw = targetInput.value.trim();
      if (!raw) {
        showToast('請先在輸入框輸入練習文字，或點擊上方「範例」快速載入！');
        targetInput.focus();
        return;

      if (isRecording) {
        stopSpeechEngine();
      }

      hideToast();
      targetText = raw;
      attemptNumber = 0;

      practiceSection.classList.remove('hidden');
      attemptBadge.classList.add('hidden');

      resetVisualStates();
      renderTargetTokens(tokenizeTarget(targetText), 'initial');
    }

    function handleNextSentence() {
      const samples = currentLangObj.samples;
      const idx = samples.findIndex(s => s.text === targetText);

        targetInput.value = next.text;
        handleConfirm();

    // =========================================================================
    // 6. Web Speech API 語音辨識引擎
    // =========================================================================
    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return;

      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = currentLangObj.id;

      recognition.onstart = () => {
        isRecording = true;
        updateRecordingUI(true);
      };

      recognition.onresult = (event) => {
        let interim = '';
        let finalStr = '';

        for (let i = 0; i < event.results.length; i++) {
          const piece = event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            finalStr += piece;
          } else {
            interim += piece;
          }
        }

        finalTranscript = finalStr;
        interimTranscript = interim;

        const combined = (finalTranscript + ' ' + interimTranscript).trim();
        if (combined) {
          // 即時以綠色 (#22C55E) 顯示正在語音輸入中的文字
          liveTranscriptText.innerHTML = `
            <span class="text-[#22C55E]">${escapeHTML(finalTranscript)}</span>
            <span class="text-[#4ADE80] opacity-90">${escapeHTML(interimTranscript)}</span>
            <span class="inline-block w-1.5 h-5 ml-1 align-middle bg-[#22C55E] animate-pulse"></span>
          `;
        }
      };

      recognition.onerror = (event) => {
        isRecording = false;
        updateRecordingUI(false);
        if (event.error === 'not-allowed') {
          showToast('麥克風權限未開啟，請允許存取或使用下方「無麥克風模擬測試」。');
        } else if (event.error === 'no-speech') {
          showToast('未偵測到語音輸入，請靠近麥克風再試一次。');
        } else {
          showToast(`語音辨識提示 (${event.error})：可使用下方「無麥克風模擬測試」體驗完整功能。`);
        }
      };

      recognition.onend = () => {
        if (isRecording) {
          isRecording = false;
          updateRecordingUI(false);
          const spoken = (finalTranscript + ' ' + interimTranscript).trim();
          if (spoken) {
            evaluatePronunciation(spoken);
          }
        }
      };
    }

    function startRecording() {
      if (!targetText) {
        showToast('請先輸入文字並按下「確認」！');
        return;
      }

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        showToast('此瀏覽器環境不支援原生語音輸入，請直接點擊下方「無麥克風模擬測試」按鈕！');
        return;
      }

      if (!recognition) initSpeechRecognition();

      hideToast();
      finalTranscript = '';
      interimTranscript = '';
      recognition.lang = currentLangObj.id;

      liveTranscriptText.innerHTML = `<span class="text-[#22C55E] text-sm font-semibold animate-pulse">🎙️ [${currentLangObj.name}] 正在聆聽中，請開始朗讀...</span>`;

      try {
        recognition.start();
      } catch (e) {
        recognition.stop();
        setTimeout(() => {
          try { recognition.start(); } catch (err) {}
        }, 200);
      }
    }

    function stopSpeechEngine() {
      isRecording = false;
      if (recognition) {
        try { recognition.stop(); } catch (e) {}
      }
      updateRecordingUI(false);
    }

    function stopRecordingAndCompare() {
      const spoken = (finalTranscript + ' ' + interimTranscript).trim();
      stopSpeechEngine();

      if (!spoken) {
        liveTranscriptText.innerHTML = '<span class="text-slate-500 text-sm font-normal">未收到語音內容，請重新錄音或使用模擬測試。</span>';
        showToast('未偵測到語音內容，請大聲朗讀或使用下方「模擬測試」。');
        startRecordBtn.classList.remove('hidden');
        stopRecordBtn.classList.add('hidden');
        return;
      }

      liveTranscriptText.innerHTML = `<span class="text-[#22C55E]">${escapeHTML(spoken)}</span>`;
      evaluatePronunciation(spoken);
    }

    function updateRecordingUI(recording) {
      if (recording) {
        startRecordBtn.classList.add('hidden');
        reRecordBtn.classList.add('hidden');
        perfectActions.classList.add('hidden');
        stopRecordBtn.classList.remove('hidden');

        liveDot.className = 'w-2.5 h-2.5 rounded-full bg-[#22C55E] animate-ping';
        soundWaveBars.classList.remove('hidden');
      } else {
        stopRecordBtn.classList.add('hidden');
        liveDot.className = 'w-2 h-2 rounded-full bg-slate-600';
        soundWaveBars.classList.add('hidden');
      }
    }

    function handleReRecord() {
      finalTranscript = '';
      interimTranscript = '';
      targetCard.classList.remove('perfect-card-border');
      perfectBanner.classList.add('hidden');
      perfectActions.classList.add('hidden');
      reRecordBtn.classList.add('hidden');

      startRecording();
    }

    // =========================================================================
    // 7. 7 語系分詞與拼音 / 注音 / 假名羅馬音 / IPA 音標解析引擎
    // =========================================================================
    function tokenizeTarget(text) {
      const tokens = [];
      const langType = currentLangObj.type;

      if (langType === 'cjk-zh' || langType === 'cjk-ja') {
        // 中日文逐字拆解
        for (const char of text) {
          const isPunctuation = /[\s\p{P}\p{S}]/u.test(char);
          tokens.push({
            raw: char,
            normalized: char.toLowerCase(),
            isPunctuation,
            phonetic: isPunctuation ? '' : getPhoneticGuide(char),
            status: 'pending'
          });
        }
      } else {
        // 英文 (US/GB)、法文、德文逐詞拆解
        const parts = text.split(/(\s+)/);
        for (const part of parts) {
          if (!part) continue;
          if (/^\s+$/.test(part)) {
            tokens.push({ raw: part, isSpace: true, isPunctuation: true });
            continue;
          }
          const cleanWord = part.replace(/^[^\p{L}\p{N}’']+|[^\p{L}\p{N}’']+$/gu, '');
          const isPunctuation = cleanWord.length === 0;
          tokens.push({
            raw: part,
            cleanWord,
            normalized: cleanWord.toLowerCase().replace(/’/g, "'"),
            isPunctuation,
            phonetic: isPunctuation ? '' : getPhoneticGuide(cleanWord),
            status: 'pending'
          });
        }
      }
      return tokens;
    }

    function getPhoneticGuide(unit) {
      const id = currentLangObj.id;

      // 1. 普通話 (zh-CN)
      if (id === 'zh-CN') {
        const entry = ZH_PHONETIC_DICT[unit];
        return entry ? entry[0] : 'pīn yīn';
      }

      // 2. 台灣國語 (zh-TW) -> 顯示拼音 + 注音符號
      if (id === 'zh-TW') {
        const entry = ZH_PHONETIC_DICT[unit];
        return entry ? entry[1] : '注音/拼音';
      }

      // 3. 日文 (ja-JP) -> 假名轉羅馬音 或 漢字讀音提示
      if (id === 'ja-JP') {
        if (KANA_TO_ROMAJI[unit]) {
          return `${unit} [${KANA_TO_ROMAJI[unit]}]`;
        }
        if (JA_KANJI_DICT[unit]) {
          return JA_KANJI_DICT[unit];
        }
        return 'よみかた';
      }

      const lower = unit.toLowerCase().replace(/’/g, "'");

      // 4. 美式英文 (en-US)
      if (id === 'en-US') {
        if (EN_US_IPA[lower]) return `${EN_US_IPA[lower]} (US)`;
        return lower.split('').join('·');
      }

      // 5. 英式英文 (en-GB)
      if (id === 'en-GB') {
        if (EN_GB_IPA[lower]) return `${EN_GB_IPA[lower]} (UK)`;
        return lower.split('').join('·');
      }

      // 6. 法文 (fr-FR)
      if (id === 'fr-FR') {
        if (FR_IPA[lower]) return FR_IPA[lower];
        return lower.split('').join('·');
      }

      // 7. 德文 (de-DE)
      if (id === 'de-DE') {
        if (DE_IPA[lower]) return DE_IPA[lower];
        return lower.split('').join('·');
      }

      return lower;
    }

    // =========================================================================
    // 8. 發音比對核心 (LCS 序列對齊 + 100% 全黃色判定)
    // =========================================================================
    function evaluatePronunciation(spokenText) {
      attemptNumber++;
      attemptBadge.classList.remove('hidden');
      attemptCount.textContent = attemptNumber;

      const tokens = tokenizeTarget(targetText);
      const langType = currentLangObj.type;
      const activeTokens = tokens.filter(t => !t.isPunctuation);

      if (langType === 'cjk-zh' || langType === 'cjk-ja') {
        const spokenChars = Array.from(spokenText.replace(/[\s\p{P}\p{S}]/gu, '')).map(c => c.toLowerCase());
        const matchedIndices = computeLCSIndices(
          activeTokens.map(t => t.normalized),
          spokenChars
        );
        activeTokens.forEach((token, idx) => {
          token.status = matchedIndices.has(idx) ? 'correct' : 'error';
        });
      } else {
        const spokenWords = spokenText
          .toLowerCase()
          .replace(/’/g, "'")
          .replace(/[^\p{L}\p{N}'\s-]/gu, ' ')
          .split(/\s+/)
          .filter(Boolean);

        const matchedIndices = computeLCSIndices(
          activeTokens.map(t => t.normalized),
          spokenWords
        );
        activeTokens.forEach((token, idx) => {
          token.status = matchedIndices.has(idx) ? 'correct' : 'error';
        });
      }

      const total = activeTokens.length;
      const correctCount = activeTokens.filter(t => t.status === 'correct').length;
      const errorCount = total - correctCount;
      const accuracy = total > 0 ? Math.round((correctCount / total) * 100) : 100;

      resultSummaryBar.classList.remove('hidden');
      accuracyScore.textContent = `${accuracy}%`;
      accuracyBarFill.style.width = `${accuracy}%`;

      if (errorCount === 0 && total > 0) {
        // 100% 發音完全正確 -> 所有文字轉為亮黃色顯示 (#FACC15)
        accuracyScore.className = 'font-extrabold text-base text-[#FACC15]';
        accuracyBarFill.className = 'h-full bg-[#FACC15] transition-all duration-500';
        errorCountText.className = 'font-bold text-[#FACC15]';
        errorCountText.textContent = '✨ 零錯誤 · 100% 完美！';

        targetCard.classList.add('perfect-card-border');
        perfectBanner.classList.remove('hidden');

        renderTargetTokens(tokens, 'perfect');

        startRecordBtn.classList.add('hidden');
        stopRecordBtn.classList.add('hidden');
        reRecordBtn.classList.add('hidden');
        perfectActions.classList.remove('hidden');

        playCelebrationTone();
      } else {
        // 有發音錯誤 -> 紅色顯示拼音/音標/字母，並顯示「再錄音」按鈕
        accuracyScore.className = 'font-extrabold text-base text-rose-400';
        accuracyBarFill.className = 'h-full bg-rose-500 transition-all duration-500';
        errorCountText.className = 'font-bold text-[#EF4444]';
        errorCountText.textContent = `有 ${errorCount} 處發音需修正`;

        targetCard.classList.remove('perfect-card-border');
        perfectBanner.classList.add('hidden');

        renderTargetTokens(tokens, 'reviewed');

        startRecordBtn.classList.add('hidden');
        stopRecordBtn.classList.add('hidden');
        perfectActions.classList.add('hidden');
        reRecordBtn.classList.remove('hidden');
      }
    }

    function computeLCSIndices(targetArr, spokenArr) {
      const m = targetArr.length;
      const n = spokenArr.length;
      const dp = Array.from({ length: m + 1 }, () => Array(n + 1).fill(0));

      for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
          if (targetArr[i - 1] === spokenArr[j - 1]) {
            dp[i][j] = dp[i - 1][j - 1] + 1;
          } else {
            dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
          }
        }
      }

      const matched = new Set();
      let i = m, j = n;
      while (i > 0 && j > 0) {
        if (targetArr[i - 1] === spokenArr[j - 1]) {
          matched.add(i - 1);
          i--;
          j--;
        } else if (dp[i - 1][j] >= dp[i][j - 1]) {
          i--;
        } else {
          j--;
        }
      }
      return matched;
    }

    // =========================================================================
    // 9. 渲染目標文字欄 (待測白色 / 正確綠色 / 錯誤紅色拼音音標 / 100%全黃色)
    // =========================================================================
    function renderTargetTokens(tokens, mode) {
      const html = tokens.map(token => {
        if (token.isSpace) {
          return `<span class="w-1.5"></span>`;
        }

        // 100% 正確狀態：全部文字以亮黃色顯示 (#FACC15)
        if (mode === 'perfect') {
          return `
            <span class="inline-flex flex-col items-center">
              <span class="text-xl sm:text-2xl font-black perfect-yellow-glow transition-all duration-300">
                ${escapeHTML(token.raw)}
              </span>
            </span>
          `;
        }

        if (token.isPunctuation) {
          return `
            <span class="inline-flex flex-col items-center">
              <span class="text-xl sm:text-2xl font-bold text-slate-400">${escapeHTML(token.raw)}</span>
            </span>
          `;
        }

        if (mode === 'initial' || token.status === 'pending') {
          return `
            <span class="inline-flex flex-col items-center">
              <span class="text-xl sm:text-2xl font-bold text-white tracking-wide">
                ${escapeHTML(token.raw)}
              </span>
            </span>
          `;
        }

        if (token.status === 'correct') {
          return `
            <span class="inline-flex flex-col items-center">
              <span class="text-[11px] font-bold text-emerald-400/90 mb-0.5 select-none">✓</span>
              <span class="text-xl sm:text-2xl font-bold text-emerald-300">
                ${escapeHTML(token.raw)}
              </span>
            </span>
          `;
        }

        // 發音錯誤：紅色高亮字詞 + 紅色拼音 / 音標 / 拼寫字母
        return `
          <span class="inline-flex flex-col items-center px-2 py-1 rounded-xl bg-red-500/15 border border-red-500/50">
            <span class="text-[11px] font-extrabold text-[#EF4444] tracking-wide mb-0.5">
              ${escapeHTML(token.phonetic)}
            </span>
            <span class="text-xl sm:text-2xl font-black text-[#EF4444] underline decoration-red-500/80 decoration-2 underline-offset-4">
              ${escapeHTML(token.raw)}
            </span>
          </span>
        `;
      }).join('');

      targetDisplayContainer.innerHTML = html;
    }

    // =========================================================================
    // 10. TTS 示範朗讀、模擬測試工具、慶祝音效
    // =========================================================================
    function speakTargetText() {
      if (!targetText) return;
      if (!('speechSynthesis' in window)) {
        showToast('您的瀏覽器不支援語音朗讀功能。');
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(targetText);
      utterance.lang = currentLangObj.id;
      utterance.rate = 0.88;
      window.speechSynthesis.speak(utterance);
    }

    function simulateSpeech(isPerfect) {
      if (!targetText) {
        showToast('請先在輸入框輸入文字並按下「確認」！');
        return;
      }
      if (isRecording) stopSpeechEngine();
      hideToast();

      let simulatedSpoken = targetText;
      if (!isPerfect) {
        if (currentLangObj.type === 'cjk-zh' || currentLangObj.type === 'cjk-ja') {
          const chars = Array.from(targetText);
          simulatedSpoken = chars
            .map((ch, idx) => (idx % 3 === 1 && !/[\s\p{P}]/u.test(ch) ? '' : ch))
            .join('');
        } else {
          const words = targetText.split(/\s+/);
          simulatedSpoken = words
            .map((w, idx) => (idx % 3 === 1 ? 'mispronounced' : w))
            .join(' ');
        }
      }

      liveDot.className = 'w-2.5 h-2.5 rounded-full bg-[#22C55E] animate-ping';
      soundWaveBars.classList.remove('hidden');
      liveTranscriptText.innerHTML = `<span class="text-[#22C55E]">${escapeHTML(simulatedSpoken)}</span>`;

      setTimeout(() => {
        liveDot.className = 'w-2 h-2 rounded-full bg-slate-600';
        soundWaveBars.classList.add('hidden');
        evaluatePronunciation(simulatedSpoken);
      }, 600);
    }

    function playCelebrationTone() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.08);
          gain.gain.setValueAtTime(0.12, ctx.currentTime + i * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.08 + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + i * 0.08);
          osc.stop(ctx.currentTime + i * 0.08 + 0.36);
        });
      } catch (e) {}
    }

    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
